<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Infographic: Global Temperature Rise</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>
  <header>
    <h1>Global Temperature Anomalies (1880 - 2020)</h1>
    <p class="description">Explore how Earth's average surface temperature has changed over time due to climate change. Hover over the graph to see details.</p>
  </header>

  <div class="chart-container">
    <canvas id="climateChart"></canvas>
    <div id="tooltip" class="tooltip-box"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
