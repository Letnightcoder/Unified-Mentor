<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 
</head>
<body>
  <div class="container">
    <h1>Expense Tracker</h1>

    <form id="transaction-form">
      <input type="date" id="date" required>
      <input type="text" id="description" placeholder="Description" required>
      <select id="category" required>
        <option value="">Select Category</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Entertainment</option>
        <option>Utilities</option>
        <option>Salary</option>
        <option>Others</option>
      </select>
      <input type="number" id="amount" placeholder="Amount" required>
      <select id="type" required>
        <option value="">Type</option>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <button type="submit">Add</button>
    </form>

    <div class="filter">
      <label>Filter by Category: </label>
      <select id="filter-category">
        <option value="all">All</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Entertainment</option>
        <option>Utilities</option>
        <option>Salary</option>
        <option>Others</option>
      </select>
    </div>

    <div class="summary">
      <div><strong>Total Income:</strong><br><span id="total-income">₹0</span></div>
      <div><strong>Total Expenses:</strong><br><span id="total-expense">₹0</span></div>
      <div><strong>Net Balance:</strong><br><span id="net-balance">₹0</span></div>
    </div>

    <div class="transactions">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="transaction-list"></tbody>
      </table>
    </div>

    <h2>Expense Breakdown</h2>
    <canvas id="expense-chart" height="100"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
